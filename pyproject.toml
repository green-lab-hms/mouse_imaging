[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse_imaging"
version = "0.1.0"
description = "Two-photon imaging and ViRMEn behavior preprocessing and analysis"
requires-python = ">=3.11" # tomllib
dependencies = [
    "numpy",
    "scipy",
    "pandas>=2",
    "anndata>=0.10",
    "matplotlib",
    "matplotlib-inline",
    "seaborn",
    "tifffile",
    "scanimage-tiff-reader",
    "pyabf",
    "h5py",
    "igraph",
    "umap-learn",
    "scikit-learn",
    "tqdm",
]

[project.optional-dependencies]
# Step 1 of preprocess.py (motion correction, ROI detection). Brings in torch.
suite2p = ["suite2p>=1.1"]
notebook = ["ipykernel"]

[tool.setuptools]
packages = ["mouse_imaging"]

[tool.setuptools.package-data]
# The SLURM script that pipeline.py submits
mouse_imaging = ["preprocess.slurm"]
